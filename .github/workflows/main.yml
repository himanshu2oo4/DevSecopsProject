name: tetris game CI CD 
on: 
    push: 
        branches: 
            - main 
    pull_request: 
        branches: 
            - main

permissions: 
    contents: read  
jobs: 
    build-and-test: 
        defaults: 
            run: 
                working-directory: ./Tetris-V2
        runs-on: ubuntu-latest 
        steps: 
            - name: Code checkout 
              uses: actions/checkout@v4
              with: 
                fetch-depth: 0       # fetches all the history required for Sonarqube analysis   

            - name: setting up Node js 
              uses: actions/setup-node@v4 
              with: 
                node-version: "18"
                
            
            - name: installing dependencies
              run: npm ci 
            
            - name: SonarQube scan 
              uses: sonarsource/sonarqube-scan-action@v4
              env: 
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

            

            - name: Sonar Quality Gate check 
              uses: sonarsource/sonarqube-quality-gate-action@v1
              timeout-minutes: 5 
              env: 
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

            - name: OWASP Dependency Check
              uses: dependency-check/Dependency-Check_Action@main
              with:
                project: 'tetris-devsecops'
                path: '.'
                format: 'HTML'
                out: 'reports'
                args: >
                    --enableRetired

            - name: Upload dependency check report 
              uses: actions/upload-artifact@v4 
              with: 
                name: dependency-check-reports
                path: report 


            - name: Trivy fs scan 
              uses: aquasecurity/trivy-action@v0.36.0
              with:
               scan-type: 'fs'
               scan-ref: '.'
               format: 'table'
               severity: 'CRITICAL,HIGH,MEDIUM'
               exit-code: '1'
    
            - name: trivy Fs scan report 
              if: always()
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'fs'
                scan-ref: '.'
                format: 'json'
                output: 'trivy-fs-report.json'
                severity: 'CRITICAL,HIGH,MEDIUM'
                exit-code: '0'


            - name: Upload Trivy Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: trivy-fs-report
                path: trivy-fs-report.json

    