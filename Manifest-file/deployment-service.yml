apiVersion: apps/v1
kind: Deployment
metadata:
  name: tetris-deployment
  namespace: tetris 
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: tetris 
  template:
    metadata:
      labels:
        app: tetris 
    spec:
      containers:
      - name: tetris
        image: himanshu1236/tetrisv2:1.0.0
        imagePullPolicy: Always 
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests: 
            memory: 200Mi 
            cpu: 200m 
        ports:
        - containerPort: 3000



--- 

apiVersion: v1
kind: Service
metadata:
  name: tetris-service
  namespace: tetris 
spec:
  type: LoadBalancer 
  selector:
    app: tetris 
  ports:
  - port: 80 
    targetPort: 3000 
    protocol: TCP 
  


# Internet
#    │
#    ▼
# AWS Load Balancer
#    │
#    ▼
# tetris-service :80
#    │
#    ├──────────────┐
#    ▼              ▼
# Pod 1            Pod 2
#  :3000            :3000